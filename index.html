<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>중기 투자환경 대시보드</title>
  <style>
    :root {
      --bg: #07111f;
      --panel: #0d1b2d;
      --panel-strong: #12243a;
      --line: #203650;
      --text: #eef5ff;
      --muted: #90a4be;
      --good: #35d49a;
      --warn: #f4c45e;
      --bad: #ff707d;
      --accent: #73a9ff;
      --shadow: 0 18px 45px rgba(0, 0, 0, .22);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at 85% -10%, rgba(48, 112, 213, .25), transparent 34%),
        radial-gradient(circle at -10% 25%, rgba(29, 179, 138, .13), transparent 30%),
        var(--bg);
      color: var(--text);
      font-family: Inter, Pretendard, "Noto Sans KR", system-ui, sans-serif;
    }
    .shell {
      width: min(1120px, calc(100% - 32px));
      margin: 0 auto;
      padding: 38px 0 60px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 24px;
      margin-bottom: 26px;
    }
    .eyebrow {
      margin: 0 0 9px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      font-size: clamp(28px, 5vw, 48px);
      line-height: 1.12;
      letter-spacing: -.04em;
    }
    .updated {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      text-align: right;
    }
    .hero-grid, .index-grid, .valuation-grid, .sentiment-grid, .future-grid {
      display: grid;
      gap: 16px;
    }
    .hero-grid { grid-template-columns: 1.35fr .65fr; }
    .index-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 16px; }
    .valuation-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 16px; }
    .sentiment-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 16px; }
    .future-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 16px; }
    .card {
      background: linear-gradient(145deg, rgba(18, 36, 58, .94), rgba(11, 27, 46, .94));
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .hero { padding: 30px; }
    .hero-main {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 24px;
    }
    .label { color: var(--muted); font-size: 13px; }
    .status {
      margin: 8px 0 10px;
      font-size: clamp(24px, 4vw, 36px);
      font-weight: 750;
      letter-spacing: -.03em;
    }
    .summary { margin: 0; color: var(--muted); line-height: 1.65; }
    .score-ring {
      --score: 0;
      --tone: var(--accent);
      width: 132px;
      aspect-ratio: 1;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background:
        radial-gradient(circle, var(--panel-strong) 61%, transparent 63%),
        conic-gradient(var(--tone) calc(var(--score) * 1%), rgba(144,164,190,.16) 0);
    }
    .score-number { font-size: 34px; font-weight: 800; letter-spacing: -.04em; }
    .score-unit { color: var(--muted); font-size: 12px; text-align: center; }
    .legend { display: flex; gap: 18px; flex-wrap: wrap; margin-top: 24px; }
    .legend span { color: var(--muted); font-size: 12px; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .dot.good { background: var(--good); }
    .dot.warn { background: var(--warn); }
    .dot.bad { background: var(--bad); }
    .allocation {
      padding: 26px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .allocation h2, .section-title { margin: 0; font-size: 16px; }
    .bar {
      height: 12px;
      margin: 24px 0 11px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(144,164,190,.14);
    }
    .bar > span {
      display: block;
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--accent), var(--good));
      transition: width .6s ease;
    }
    .scale { display: flex; justify-content: space-between; color: var(--muted); font-size: 11px; }
    .index-card { padding: 24px; }
    .valuation-card { padding: 24px; }
    .valuation-title { margin: 5px 0 0; font-size: 22px; }
    .valuation-value { margin-top: 22px; font-size: 34px; font-weight: 800; letter-spacing: -.04em; }
    .valuation-note { margin: 14px 0 0; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .sentiment-card { padding: 24px; }
    .index-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .index-name { margin: 5px 0 0; font-size: 25px; }
    .badge {
      border-radius: 999px;
      padding: 7px 10px;
      background: rgba(115,169,255,.12);
      color: var(--accent);
      font-size: 12px;
      white-space: nowrap;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 22px;
    }
    .metric {
      padding: 14px;
      border-radius: 14px;
      background: rgba(7,17,31,.38);
      border: 1px solid rgba(32,54,80,.7);
    }
    .metric strong { display: block; margin-top: 7px; font-size: 17px; }
    .positive { color: var(--good); }
    .negative { color: var(--bad); }
    .future-card { min-height: 128px; padding: 20px; opacity: .72; }
    .future-icon { color: var(--accent); font-size: 22px; }
    .future-card h3 { margin: 18px 0 6px; font-size: 14px; }
    .future-card p { margin: 0; color: var(--muted); font-size: 12px; line-height: 1.5; }
    .error {
      display: none;
      margin-bottom: 16px;
      padding: 14px 16px;
      border: 1px solid rgba(255,112,125,.4);
      border-radius: 14px;
      color: var(--bad);
      background: rgba(255,112,125,.08);
    }
    footer { margin-top: 22px; color: var(--muted); font-size: 11px; text-align: center; }
    @media (max-width: 760px) {
      .shell { width: min(100% - 22px, 680px); padding-top: 24px; }
      header { align-items: flex-start; flex-direction: column; }
      .updated { text-align: left; }
      .hero-grid, .index-grid, .valuation-grid, .sentiment-grid { grid-template-columns: 1fr; }
      .future-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .hero-main { align-items: flex-start; }
      .score-ring { width: 108px; }
    }
    @media (max-width: 430px) {
      .hero { padding: 22px; }
      .hero-main { flex-direction: column-reverse; }
      .score-ring { width: 96px; }
      .future-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">3–6 month market signal</p>
        <h1>중기 투자환경</h1>
      </div>
      <p class="updated" id="updated">데이터를 불러오는 중입니다.</p>
    </header>

    <div class="error" id="error"></div>

    <section class="hero-grid" aria-label="한국시장 요약">
      <article class="card hero">
        <div class="hero-main">
          <div>
            <span class="label">한국시장 추세 판단</span>
            <div class="status" id="korea-status">분석 준비 중</div>
            <p class="summary" id="korea-summary">KOSPI와 KOSDAQ의 중기 추세를 종합합니다.</p>
          </div>
          <div class="score-ring" id="score-ring" aria-label="한국시장 추세 점수">
            <div>
              <div class="score-number" id="korea-score">--</div>
              <div class="score-unit">100점 만점</div>
            </div>
          </div>
        </div>
        <div class="legend" aria-label="점수 기준">
          <span><i class="dot good"></i>60점 이상 상승 우위</span>
          <span><i class="dot warn"></i>40–59점 중립</span>
          <span><i class="dot bad"></i>39점 이하 하락 우위</span>
        </div>
      </article>

      <article class="card allocation">
        <div>
          <span class="label">현재 완성도</span>
          <h2>추세·밸류·심리 연결됨</h2>
        </div>
        <div>
          <div class="bar"><span style="width:60%"></span></div>
          <div class="scale"><span>추세</span><span>전체 모델</span></div>
        </div>
      </article>
    </section>

    <section class="index-grid" id="index-grid" aria-label="시장별 추세"></section>

    <section class="valuation-grid" id="valuation-grid" aria-label="대표지수 밸류에이션"></section>

    <section class="sentiment-grid" id="sentiment-grid" aria-label="한국시장 센티먼트"></section>

    <section class="future-grid" aria-label="추가 예정 분석">
      <article class="card future-card"><div class="future-icon">◇</div><h3>미국시장</h3><p>미국 추세와 금융환경을 추가할 예정입니다.</p></article>
      <article class="card future-card"><div class="future-icon">★</div><h3>KODEX TOP 5</h3><p>시장환경에 맞는 ETF 순위를 추가할 예정입니다.</p></article>
    </section>

    <footer>본 화면은 투자환경 판단 보조자료이며 수익을 보장하지 않습니다.</footer>
  </main>

  <script>
    const fmt = new Intl.NumberFormat("ko-KR", { maximumFractionDigits: 2 });
    const toneFor = score => score >= 60 ? "var(--good)" : score >= 40 ? "var(--warn)" : "var(--bad)";
    const signed = value => `${value >= 0 ? "+" : ""}${fmt.format(value)}%`;

    function indexCard(item) {
      const returnClass3 = item.return_3_months_pct >= 0 ? "positive" : "negative";
      const returnClass6 = item.return_6_months_pct >= 0 ? "positive" : "negative";
      return `
        <article class="card index-card">
          <div class="index-head">
            <div><span class="label">${item.code}</span><h2 class="index-name">${item.name}</h2></div>
            <span class="badge">${item.score}점 · ${item.status}</span>
          </div>
          <div class="metrics">
            <div class="metric"><span class="label">현재 지수</span><strong>${fmt.format(item.close)}</strong></div>
            <div class="metric"><span class="label">50일 / 200일선</span><strong>${fmt.format(item.moving_average_50)} / ${fmt.format(item.moving_average_200)}</strong></div>
            <div class="metric"><span class="label">3개월 수익률</span><strong class="${returnClass3}">${signed(item.return_3_months_pct)}</strong></div>
            <div class="metric"><span class="label">6개월 수익률</span><strong class="${returnClass6}">${signed(item.return_6_months_pct)}</strong></div>
          </div>
        </article>`;
    }

    const valuationNames = {
      kospi200: "KOSPI 200",
      kosdaq150: "KOSDAQ 150"
    };
    const methodNames = {
      KIS_ONLY: "KIS 추정값",
      EXTERNAL_PRIMARY: "외부 컨센서스 우선",
      BLENDED_50_50_EARNINGS_YIELD: "KIS·외부 5:5 혼합",
      UNAVAILABLE: "확정 보류"
    };

    function valueOrDash(value, suffix = "") {
      return value === null || value === undefined ? "—" : `${fmt.format(value)}${suffix}`;
    }

    function valuationCard([key, item]) {
      const finalText = item.final_forward_per === null
        ? "확정 보류"
        : `${fmt.format(item.final_forward_per)}배`;
      return `
        <article class="card valuation-card">
          <div class="index-head">
            <div><span class="label">12M Forward PER</span><h2 class="valuation-title">${valuationNames[key] || key}</h2></div>
            <span class="badge">${item.confidence} · ${methodNames[item.method] || item.method}</span>
          </div>
          <div class="valuation-value">${finalText}</div>
          <div class="metrics">
            <div class="metric"><span class="label">KIS 추정</span><strong>${valueOrDash(item.kis_forward_per, "배")}</strong></div>
            <div class="metric"><span class="label">외부 컨센서스</span><strong>${valueOrDash(item.external_forward_per, "배")}</strong></div>
            <div class="metric"><span class="label">KIS 유효 비중</span><strong>${valueOrDash(item.kis_coverage_pct, "%")}</strong></div>
            <div class="metric"><span class="label">두 값의 유사도</span><strong>${valueOrDash(item.similarity_pct, "%")}</strong></div>
          </div>
          <p class="valuation-note">${item.note}${item.external_source ? ` · ${item.external_source} (${item.external_as_of})` : ""}</p>
        </article>`;
    }

    function sentimentCard(item) {
      const tone = toneFor(item.score);
      return `
        <article class="card sentiment-card">
          <div class="index-head">
            <div><span class="label">전일 시장 심리</span><h2 class="valuation-title">${item.name}</h2></div>
            <span class="badge">${item.score}점 · ${item.status}</span>
          </div>
          <div class="valuation-value" style="color:${tone}">${item.score}점</div>
          <div class="metrics">
            <div class="metric"><span class="label">상승 종목 비율</span><strong>${valueOrDash(item.advance_ratio_pct, "%")}</strong></div>
            <div class="metric"><span class="label">시장 폭 점수</span><strong>${valueOrDash(item.breadth_score, "점")}</strong></div>
            <div class="metric"><span class="label">외국인+기관 순매수</span><strong>${signed(item.smart_money_ratio_pct)}</strong></div>
            <div class="metric"><span class="label">전일 등락률</span><strong>${signed(item.daily_return_pct)}</strong></div>
          </div>
          <p class="valuation-note">기준일 ${item.trading_date} · 신뢰도 ${item.confidence}</p>
        </article>`;
    }

    fetch("./data/dashboard.json", { cache: "no-store" })
      .then(response => {
        if (!response.ok) throw new Error("대시보드 데이터가 아직 생성되지 않았습니다.");
        return response.json();
      })
      .then(data => {
        const korea = data.market.korea;
        document.getElementById("updated").textContent =
          `마지막 갱신 · ${new Date(data.updated_at).toLocaleString("ko-KR")}`;
        document.getElementById("korea-status").textContent = korea.status;
        document.getElementById("korea-score").textContent = korea.trend_score;
        const ring = document.getElementById("score-ring");
        ring.style.setProperty("--score", korea.trend_score);
        ring.style.setProperty("--tone", toneFor(korea.trend_score));
        document.getElementById("korea-summary").textContent =
          `KOSPI와 KOSDAQ의 이동평균 및 3·6개월 수익률을 종합한 추세 점수입니다.`;
        document.getElementById("index-grid").innerHTML =
          korea.indexes.map(indexCard).join("");
        const valuation = korea.valuation || {};
        const valuationItems = Object.entries(valuation.markets || {});
        document.getElementById("valuation-grid").innerHTML =
          valuationItems.map(valuationCard).join("");
        const sentiment = korea.sentiment || {};
        document.getElementById("sentiment-grid").innerHTML =
          (sentiment.markets || []).map(sentimentCard).join("");
      })
      .catch(error => {
        const box = document.getElementById("error");
        box.style.display = "block";
        box.textContent = error.message;
      });
  </script>
</body>
</html>
